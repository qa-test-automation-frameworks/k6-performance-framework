services:
  db:
    image: postgres:18.6-alpine3.23@sha256:885cf05d376c7cf27afef02073e6bdac3841252537f16e244fd1c1e6a7c99fb1
    environment:
      POSTGRES_DB: reference_app
      POSTGRES_USER: reference_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a synthetic local password}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U reference_app -d reference_app']
      interval: 2s
      timeout: 2s
      retries: 30
    networks: [data]
    volumes: [postgres-data:/var/lib/postgresql]
    cpus: 0.5
    mem_limit: 512m

  app:
    image: ${APP_IMAGE:?Set the image built from the pinned app source}
    environment:
      NODE_ENV: production
      PORT: 4300
      DATABASE_URL: postgres://reference_app:${POSTGRES_PASSWORD:?Set a synthetic local password}@db:5432/reference_app
      APP_NAMESPACE: ${APP_NAMESPACE:?Set a unique namespace}
      APP_SOURCE_SHA: ${TARGET_COMMIT:?Set the pinned source commit}
      SEED_VERSION: ${FIXTURE_VERSION:-v0.1.0}
      TEST_MODE: 'true'
      TEST_CONTROL_TOKEN: ${TEST_CONTROL_TOKEN:?Set a random test-only token}
      SESSION_TTL_SECONDS: 3600
    ports:
      - '127.0.0.1:${APP_PORT:-4300}:4300'
    depends_on:
      db:
        condition: service_healthy
    networks: [frontend, data]
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt: [no-new-privileges:true]
    cpus: 1.0
    mem_limit: 512m

networks:
  frontend: {}
  data:
    internal: true

volumes:
  postgres-data: {}
