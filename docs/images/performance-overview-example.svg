<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">
  <rect width="1000" height="420" fill="#111827"/>
  <text x="40" y="48" fill="#f9fafb" font-family="Arial" font-size="26">Performance Overview — Example</text>
  <text x="40" y="78" fill="#9ca3af" font-family="Arial" font-size="15">Seeded controlled run · illustrative values only</text>
  <g font-family="Arial">
    <rect x="40" y="110" width="210" height="105" rx="8" fill="#1f2937"/>
    <text x="60" y="140" fill="#9ca3af" font-size="14">Request rate</text>
    <text x="60" y="185" fill="#60a5fa" font-size="34">40.0 req/s</text>
    <rect x="270" y="110" width="210" height="105" rx="8" fill="#1f2937"/>
    <text x="290" y="140" fill="#9ca3af" font-size="14">p95 latency</text>
    <text x="290" y="185" fill="#34d399" font-size="34">182 ms</text>
    <rect x="500" y="110" width="210" height="105" rx="8" fill="#1f2937"/>
    <text x="520" y="140" fill="#9ca3af" font-size="14">p99 latency</text>
    <text x="520" y="185" fill="#fbbf24" font-size="34">264 ms</text>
    <rect x="730" y="110" width="230" height="105" rx="8" fill="#1f2937"/>
    <text x="750" y="140" fill="#9ca3af" font-size="14">Threshold status</text>
    <text x="750" y="185" fill="#34d399" font-size="34">PASSED</text>
  </g>
  <polyline points="55,340 145,315 235,326 325,282 415,300 505,260 595,275 685,240 775,252 865,220 945,235"
    fill="none" stroke="#60a5fa" stroke-width="4"/>
  <line x1="55" y1="360" x2="945" y2="360" stroke="#374151"/>
  <text x="40" y="400" fill="#9ca3af" font-family="Arial" font-size="13">Replace with a measured Grafana capture before release submission.</text>
</svg>
