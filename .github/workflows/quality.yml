name: Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 20
          cache: npm
      - run: npm install --global npm@10.9.4
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:coverage
      - run: npm run build
      - name: Prove the regression fixture is rejected
        run: |
          set +e
          output=$(BASELINE_FILE=tests/regression-fixtures/measured-baseline.json CANDIDATE_FILE=tests/regression-fixtures/regression-candidate.json npm run baseline:compare 2>&1)
          status=$?
          set -e
          echo "$output"
          if [ "$status" -eq 0 ]; then
            echo "Expected the inflated fixture to fail" >&2
            exit 1
          fi
          echo "$output" | grep -q "Performance regression detected"
      - name: Prove a healthy candidate is accepted
        run: BASELINE_FILE=tests/regression-fixtures/measured-baseline.json CANDIDATE_FILE=tests/regression-fixtures/healthy-candidate.json npm run baseline:compare
