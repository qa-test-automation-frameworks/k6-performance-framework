name: Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@10.9.4
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:coverage
      - run: npm run test:report
      - run: node --test scripts/tests/noise-calibration-checks.cjs
      - run: npm run test:baseline
      - run: npm run test:capacity-evidence
      - run: node scripts/tests/perf04-runner-monitor-checks.cjs
      - run: npm run test:report-history
      - run: npm run test:evidence
      - run: npm run build
      - uses: grafana/setup-k6-action@43b9fc21641a76002687994433dd586f56e791b1 # v1.2.2
        with:
          k6-version: 2.0.0
      - name: Verify actual request counts and intentional load failures
        run: npm run verify:request-rate
        env:
          FRAMEWORK_COMMIT: ${{ github.sha }}
          K6_VERSION: 2.0.0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: request-rate-count-verification
          path: reports/request-rate-verification/
      - name: Prove the regression fixture is rejected
        run: |
          set +e
          output=$(TOLERANCE_FILE=tests/regression-fixtures/tolerance.json BASELINE_FILE=tests/regression-fixtures/measured-baseline.json BASELINE_PROVENANCE_FILE=tests/regression-fixtures/measured-baseline.provenance.json CANDIDATE_FILE=tests/regression-fixtures/regression-candidate.json npm run baseline:compare 2>&1)
          status=$?
          set -e
          echo "$output"
          if [ "$status" -eq 0 ]; then
            echo "Expected the inflated fixture to fail" >&2
            exit 1
          fi
          echo "$output" | grep -q "Performance regression detected"
      - name: Prove a healthy candidate is accepted
        run: TOLERANCE_FILE=tests/regression-fixtures/tolerance.json BASELINE_FILE=tests/regression-fixtures/measured-baseline.json BASELINE_PROVENANCE_FILE=tests/regression-fixtures/measured-baseline.provenance.json CANDIDATE_FILE=tests/regression-fixtures/healthy-candidate.json npm run baseline:compare
      - name: Prove endpoint-only regression is rejected
        run: |
          set +e
          output=$(TOLERANCE_FILE=tests/regression-fixtures/tolerance.json BASELINE_FILE=tests/regression-fixtures/measured-baseline.json BASELINE_PROVENANCE_FILE=tests/regression-fixtures/measured-baseline.provenance.json CANDIDATE_FILE=tests/regression-fixtures/endpoint-regression-candidate.json npm run baseline:compare 2>&1)
          status=$?
          set -e
          echo "$output"
          test "$status" -ne 0
          echo "$output" | grep -q 'http_req_duration{name:GET /articles}.p(95)'

  windows-format:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@10.9.4
      - run: npm ci
      - run: npm run format:check
