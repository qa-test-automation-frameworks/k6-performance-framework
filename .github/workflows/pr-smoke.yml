name: PR smoke

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 20
          cache: npm
      - uses: grafana/setup-k6-action@db07bd9765aac508ef18982e52ab937fe633a065
        with:
          k6-version: 2.0.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.2.15
      - run: npm install --global npm@10.9.4
      - run: npm ci
      - run: npm run build
      - name: Run read-only smoke test
        shell: bash
        run: |
          source .github/scripts/start-realworld.sh
          k6 run dist/smoke/smoke-test.js
        env:
          TARGET_ENV: local
          BASE_URL: http://localhost:3000/api
          TEST_PROFILE: validation
          SUMMARY_NAME: smoke
          TARGET_ID: realworld-local
          TARGET_COMMIT: c8c66858a436a6e07f445fffe2253a65ff6dcb58
          FRAMEWORK_COMMIT: ${{ github.sha }}
          K6_VERSION: 2.0.0
          RUNNER_CLASS: github-hosted
      - name: Publish smoke summary
        run: |
          if [ -f reports/smoke-summary.md ]; then
            cat reports/smoke-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
        if: always()
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: smoke-results
          path: reports/
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        if: always() && hashFiles('reports/smoke-summary.md') != '' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- k6-smoke-summary -->';
            const body = `${marker}\n${fs.readFileSync('reports/smoke-summary.md', 'utf8')}`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number
            });
            const previous = comments.find(comment => comment.body?.includes(marker));
            const params = { owner: context.repo.owner, repo: context.repo.repo, body };
            if (previous) await github.rest.issues.updateComment({ ...params, comment_id: previous.id });
            else await github.rest.issues.createComment({ ...params, issue_number: context.issue.number });
