name: PR smoke

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '27 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: grafana/setup-k6-action@43b9fc21641a76002687994433dd586f56e791b1 # v1.2.2
        with:
          k6-version: 2.0.0
      - name: Capture actual k6 version
        run: |
          k6_version=$(k6 version | sed -n '1s/^k6 v\([^ ]*\).*/\1/p')
          test "$k6_version" = 2.0.0
          echo "K6_VERSION=$k6_version" >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.2.15
      - run: npm install --global npm@10.9.4
      - run: npm ci
      - run: npm run build
      - name: Run read-only smoke test
        shell: bash
        run: |
          echo "EVIDENCE_STARTED_AT_SMOKE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
          source .github/scripts/start-realworld.sh
          k6 run dist/smoke/smoke-test.js
        env:
          TARGET_ENV: local
          BASE_URL: http://localhost:3000/api
          TEST_PROFILE: validation
          SUMMARY_NAME: smoke
          TARGET_ID: realworld-local
          TARGET_COMMIT: c8c66858a436a6e07f445fffe2253a65ff6dcb58
          FRAMEWORK_COMMIT: ${{ github.sha }}
          RUNNER_CLASS: github-hosted
      - name: Emit smoke execution evidence
        if: always()
        run: |
          if [ -f reports/smoke-summary.json ]; then
            EVIDENCE_STARTED_AT="$EVIDENCE_STARTED_AT_SMOKE" node scripts/emit-portfolio-evidence.cjs --summary reports/smoke-summary.json --scope k6.pr-smoke --class controlled
          else
            EVIDENCE_STARTED_AT="$EVIDENCE_STARTED_AT_SMOKE" node scripts/emit-portfolio-evidence.cjs --unavailable-reason "k6 smoke summary was not produced" --scope k6.pr-smoke --class controlled
          fi
      - name: Validate smoke execution evidence
        if: always()
        run: node scripts/validate-portfolio-evidence.cjs reports/evidence/k6.pr-smoke.json
      - name: Record and verify an intentional k6 failure
        if: always()
        run: |
          echo "EVIDENCE_STARTED_AT_CONTROL=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
          SUMMARY_NAME=evidence-failure-control \
            TARGET_ID=k6-evidence-failure-fixture \
            TARGET_COMMIT="$GITHUB_SHA" \
            FRAMEWORK_COMMIT="$GITHUB_SHA" \
            TEST_PROFILE=controlled-negative \
            TARGET_ENV=local \
            RUNNER_CLASS=github-hosted \
            node scripts/run-evidence-failure-control.cjs
      - name: Emit intentional-failure evidence
        if: always()
        run: |
          if [ -f reports/evidence-failure-control-summary.json ]; then
            EVIDENCE_STARTED_AT="$EVIDENCE_STARTED_AT_CONTROL" node scripts/emit-portfolio-evidence.cjs --summary reports/evidence-failure-control-summary.json --scope k6.evidence-failure-control --class hermetic --optional --control-check-counts
          else
            EVIDENCE_STARTED_AT="$EVIDENCE_STARTED_AT_CONTROL" node scripts/emit-portfolio-evidence.cjs --unavailable-reason "k6 failure-control summary was not produced" --scope k6.evidence-failure-control --class hermetic --optional
          fi
      - name: Validate intentional-failure evidence
        if: always()
        run: node scripts/validate-portfolio-evidence.cjs reports/evidence/k6.evidence-failure-control.json
      - name: Verify the raw failure in a separate process
        if: always()
        run: |
          mkdir -p reports/evidence/native
          echo "EVIDENCE_STARTED_AT_VERIFIER=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
          set +e
          node --test --test-reporter=junit \
            --test-reporter-destination=reports/evidence/native/failure-control-verification.xml \
            scripts/tests/failure-control-verdict.test.cjs
          status=$?
          set -e
          echo "EVIDENCE_COMPLETED_AT_VERIFIER=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
          exit "$status"
      - name: Emit required verifier evidence
        if: always()
        env:
          TARGET_ID: k6-evidence-failure-fixture
          TARGET_ENV: local
        run: |
          if [ -s reports/evidence/native/failure-control-verification.xml ]; then
            EVIDENCE_STARTED_AT="$EVIDENCE_STARTED_AT_VERIFIER" EVIDENCE_COMPLETED_AT="$EVIDENCE_COMPLETED_AT_VERIFIER" \
              node scripts/emit-portfolio-evidence.cjs --junit reports/evidence/native/failure-control-verification.xml \
              --scope k6.evidence-failure-control-verification --class hermetic
          else
            node scripts/emit-portfolio-evidence.cjs --unavailable-reason "Verifier did not produce native JUnit results" \
              --scope k6.evidence-failure-control-verification --class hermetic
          fi
      - name: Validate verifier evidence
        if: always()
        run: node scripts/validate-portfolio-evidence.cjs reports/evidence/k6.evidence-failure-control-verification.json
      - name: Publish smoke summary
        run: |
          if [ -f reports/smoke-summary.md ]; then
            cat reports/smoke-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
        if: always()
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: smoke-results
          path: reports/
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        if: always() && hashFiles('reports/smoke-summary.md') != '' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- k6-smoke-summary -->';
            const body = `${marker}\n${fs.readFileSync('reports/smoke-summary.md', 'utf8')}`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number
            });
            const previous = comments.find(comment => comment.body?.includes(marker));
            const params = { owner: context.repo.owner, repo: context.repo.repo, body };
            if (previous) await github.rest.issues.updateComment({ ...params, comment_id: previous.id });
            else await github.rest.issues.createComment({ ...params, issue_number: context.issue.number });
