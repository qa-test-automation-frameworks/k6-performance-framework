name: Security

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  dependency-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 20
          cache: npm
      - run: npm install --global npm@10.9.4
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - name: Generate CycloneDX SBOM
        run: |
          mkdir -p artifacts
          npm run sbom
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cyclonedx-sbom
          path: artifacts/sbom.cdx.json
      - name: Scan dependencies with OSV
        uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2
        with:
          scan-args: |-
            --lockfile=package-lock.json
      - name: Scan repository for secrets
        run: npm run secrets:scan
