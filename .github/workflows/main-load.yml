name: Main load

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  load:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 20
          cache: npm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.2.15
      - uses: grafana/setup-k6-action@db07bd9765aac508ef18982e52ab937fe633a065
        with:
          k6-version: 2.0.0
      - run: npm ci
      - run: npm run build
      - name: Run controlled load test
        run: |
          source .github/scripts/start-realworld.sh
          k6 run dist/load/articles-load.js
          TEST_PROFILE=validation SUMMARY_NAME=authenticated-validation \
            k6 run dist/load/user-journey-load.js
        env:
          TARGET_ENV: local
          BASE_URL: http://localhost:3000/api
          TEST_PROFILE: full
          SUMMARY_NAME: load
      - run: cat reports/load-summary.md >> "$GITHUB_STEP_SUMMARY"
        if: always()
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: load-results
          path: reports/
      - name: Baseline regression check
        run: |
          if [[ -f baseline/load-summary.json ]]; then
            CANDIDATE_FILE=reports/load-summary.json npm run baseline:compare | tee reports/regression-comparison.md
            cat reports/regression-comparison.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No reviewed seeded baseline is available; absolute thresholds remain authoritative." | tee reports/regression-comparison.md
          fi
