name: Main load

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  load:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 20
          cache: npm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest
      - uses: grafana/setup-k6-action@db07bd9765aac508ef18982e52ab937fe633a065
        with:
          k6-version: 2.0.0
      - run: npm ci
      - run: bash .github/scripts/start-realworld.sh
      - run: npm run build
      - name: Run controlled load test
        run: k6 run dist/load/articles-load.js
        env:
          TARGET_ENV: local
          BASE_URL: http://127.0.0.1:3000/api
          TEST_PROFILE: validation
          SUMMARY_NAME: load
      - run: cat reports/load-summary.md >> "$GITHUB_STEP_SUMMARY"
        if: always()
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: load-results
          path: reports/
