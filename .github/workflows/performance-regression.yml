name: Performance regression

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 20
          cache: npm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - uses: grafana/setup-k6-action@db07bd9765aac508ef18982e52ab937fe633a065
        with:
          k6-version: 2.0.0
      - run: npm ci
      - run: npm run build
      - name: Run regression candidate
        run: |
          source .github/scripts/start-realworld.sh
          k6 run dist/load/articles-load.js
        env:
          TARGET_ENV: local
          BASE_URL: http://localhost:3000/api
          TEST_PROFILE: validation
          SUMMARY_NAME: load
      - name: Compare candidate with baseline
        run: npm run baseline:compare | tee regression.md
      - run: cat regression.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: regression-results
          path: |
            reports/
            regression.md
