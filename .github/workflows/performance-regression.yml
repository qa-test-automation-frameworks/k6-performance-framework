name: Performance regression

on:
  pull_request:
    paths:
      - '.github/workflows/performance-regression.yml'
      - '.github/scripts/start-realworld.sh'
      - 'config/**'
      - 'scripts/aggregate-baseline.cjs'
      - 'scripts/compare-performance.cjs'
      - 'src/**'
      - 'tests/load/**'
      - 'package-lock.json'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 20
          cache: npm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.2.15
      - uses: grafana/setup-k6-action@db07bd9765aac508ef18982e52ab937fe633a065
        with:
          k6-version: 2.0.0
      - run: npm install --global npm@10.9.4
      - run: npm ci
      - run: npm run build
      - name: Run regression candidate
        run: |
          source .github/scripts/start-realworld.sh
          k6 run dist/load/articles-load.js
          TEST_PROFILE=validation SUMMARY_NAME=authenticated-validation \
            k6 run dist/load/user-journey-load.js
        env:
          TARGET_ENV: local
          BASE_URL: http://localhost:3000/api
          TEST_PROFILE: full
          SUMMARY_NAME: load
          TARGET_ID: realworld-local
          TARGET_COMMIT: c8c66858a436a6e07f445fffe2253a65ff6dcb58
          FRAMEWORK_COMMIT: ${{ github.sha }}
          K6_VERSION: 2.0.0
          RUNNER_CLASS: github-hosted
      - name: Compare candidate with baseline
        shell: bash
        run: |
          set -o pipefail
          test -f baseline/load-summary.json
          npm run baseline:compare 2>&1 | tee regression.md
      - run: cat regression.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: regression-results
          path: |
            reports/
            regression.md
