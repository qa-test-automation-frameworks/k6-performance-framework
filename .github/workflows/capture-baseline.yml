name: Capture performance baseline

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 20
          cache: npm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.2.15
      - uses: grafana/setup-k6-action@db07bd9765aac508ef18982e52ab937fe633a065
        with:
          k6-version: 2.0.0
      - run: npm install --global npm@10.9.4
      - run: npm ci
      - run: npm run build
      - name: Capture three controlled runs
        shell: bash
        run: |
          source .github/scripts/start-realworld.sh
          for run_number in 1 2 3; do
            SUMMARY_NAME="baseline-${run_number}" k6 run dist/load/articles-load.js
          done
          TARGET_COMMIT=c8c66858a436a6e07f445fffe2253a65ff6dcb58 \
            FRAMEWORK_COMMIT="$GITHUB_SHA" \
            RUNNER_IMAGE="${ImageOS}-${ImageVersion}" \
            npm run baseline:aggregate -- \
            reports/baseline-1-summary.json \
            reports/baseline-2-summary.json \
            reports/baseline-3-summary.json
        env:
          TARGET_ENV: local
          BASE_URL: http://localhost:3000/api
          TEST_PROFILE: full
          TARGET_ID: realworld-local
          TARGET_COMMIT: c8c66858a436a6e07f445fffe2253a65ff6dcb58
          FRAMEWORK_COMMIT: ${{ github.sha }}
          K6_VERSION: 2.0.0
          RUNNER_CLASS: github-hosted
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: measured-load-baseline
          path: |
            reports/
            baseline/load-summary.json
