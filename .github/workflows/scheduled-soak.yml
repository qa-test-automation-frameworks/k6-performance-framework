name: Scheduled soak

on:
  schedule:
    - cron: '30 2 * * 0'
  workflow_call:
    inputs:
      profile:
        required: true
        type: string
      scenario:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      profile:
        description: Use validation for a short verification run
        required: true
        default: full
        type: choice
        options: [full, validation]
      scenario:
        description: Controlled advanced workload
        required: true
        default: soak
        type: choice
        options: [stress, spike, soak, breakpoint]

permissions:
  contents: read
  actions: read

jobs:
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.2.15
      - uses: grafana/setup-k6-action@43b9fc21641a76002687994433dd586f56e791b1 # v1.2.2
        with:
          k6-version: 2.0.0
      - run: npm install --global npm@10.9.4
      - run: npm ci
      - run: npm run build
      - name: Run controlled advanced test
        run: |
          source .github/scripts/start-realworld.sh
          case "${SCENARIO}" in
            stress) script="dist/stress/articles-stress.js" ;;
            spike) script="dist/spike/traffic-spike.js" ;;
            soak) script="dist/soak/endurance-soak.js" ;;
            breakpoint)
              node scripts/find-breakpoint.cjs
              script=''
              ;;
          esac
          if [ -n "$script" ]; then k6 run "$script"; fi
        env:
          SCENARIO: ${{ inputs.scenario || 'soak' }}
          TARGET_ENV: local
          BASE_URL: http://localhost:3000/api
          TEST_PROFILE: ${{ inputs.profile || 'full' }}
          SUMMARY_NAME: ${{ inputs.scenario || 'soak' }}
          TARGET_ID: realworld-local
          TARGET_COMMIT: c8c66858a436a6e07f445fffe2253a65ff6dcb58
          FRAMEWORK_COMMIT: ${{ github.sha }}
          K6_VERSION: 2.0.0
          RUNNER_CLASS: github-hosted
          PERF_STRICT_THRESHOLDS: ${{ inputs.profile == 'validation' && 'false' || 'true' }}
      - name: Locate historical comparison input
        id: history
        if: ${{ (inputs.profile || 'full') == 'full' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SCENARIO: ${{ inputs.scenario || 'soak' }}
          CANDIDATE_FILE: reports/${{ inputs.scenario || 'soak' }}-summary.json
        run: bash .github/scripts/select-history.sh
      - name: Compare retained historical input
        if: ${{ (inputs.profile || 'full') == 'full' && steps.history.outputs.available == 'true' }}
        shell: bash
        env:
          SCENARIO: ${{ inputs.scenario || 'soak' }}
          PREVIOUS_FILE: ${{ steps.history.outputs.previous_file }}
          CANDIDATE_FILE: reports/${{ inputs.scenario || 'soak' }}-summary.json
        run: |
          if [ "$SCENARIO" = 'breakpoint' ]; then
            CANDIDATE_FILE=reports/breakpoint-capacity.json npm run capacity:compare | tee reports/history-comparison.md
          else
            npm run history:compare | tee reports/history-comparison.md
          fi
          cat reports/history-comparison.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publish performance summary
        if: always()
        run: |
          summary="reports/${{ inputs.scenario || 'soak' }}-summary.md"
          if [ -f "$summary" ]; then cat "$summary" >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: advanced-${{ inputs.scenario || 'soak' }}-${{ inputs.profile || 'full' }}
          path: reports/
