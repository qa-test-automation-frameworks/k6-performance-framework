name: Scheduled soak

on:
  schedule:
    - cron: '30 2 * * 0'
  workflow_dispatch:
    inputs:
      profile:
        description: Use validation for a short verification run
        required: true
        default: full
        type: choice
        options: [full, validation]

permissions:
  contents: read

jobs:
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 20
          cache: npm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - uses: grafana/setup-k6-action@db07bd9765aac508ef18982e52ab937fe633a065
        with:
          k6-version: 2.0.0
      - run: npm ci
      - run: bash .github/scripts/start-realworld.sh
      - run: npm run build
      - run: k6 run dist/soak/endurance-soak.js
        env:
          TARGET_ENV: local
          BASE_URL: http://localhost:3000/api
          TEST_PROFILE: ${{ inputs.profile == 'validation' && 'validation' || '' }}
          SUMMARY_NAME: soak
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: soak-results
          path: reports/
