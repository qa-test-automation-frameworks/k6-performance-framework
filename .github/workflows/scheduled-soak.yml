name: Scheduled soak

on:
  schedule:
    - cron: '30 2 * * 0'
  workflow_dispatch:
    inputs:
      profile:
        description: Use validation for a short verification run
        required: true
        default: full
        type: choice
        options: [full, validation]
      scenario:
        description: Controlled advanced workload
        required: true
        default: soak
        type: choice
        options: [stress, spike, soak, breakpoint]

permissions:
  contents: read

jobs:
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 20
          cache: npm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.2.15
      - uses: grafana/setup-k6-action@db07bd9765aac508ef18982e52ab937fe633a065
        with:
          k6-version: 2.0.0
      - run: npm install --global npm@10.9.4
      - run: npm ci
      - run: npm run build
      - name: Run controlled advanced test
        run: |
          source .github/scripts/start-realworld.sh
          case "${SCENARIO}" in
            stress) script="dist/stress/articles-stress.js" ;;
            spike) script="dist/spike/traffic-spike.js" ;;
            soak) script="dist/soak/endurance-soak.js" ;;
            breakpoint) script="dist/breakpoint/breakpoint-test.js" ;;
          esac
          k6 run "$script"
        env:
          SCENARIO: ${{ inputs.scenario || 'soak' }}
          TARGET_ENV: local
          BASE_URL: http://localhost:3000/api
          TEST_PROFILE: ${{ inputs.profile == 'validation' && 'validation' || '' }}
          SUMMARY_NAME: ${{ inputs.scenario || 'soak' }}
          TARGET_ID: realworld-local
          TARGET_COMMIT: c8c66858a436a6e07f445fffe2253a65ff6dcb58
          FRAMEWORK_COMMIT: ${{ github.sha }}
          K6_VERSION: 2.0.0
          RUNNER_CLASS: github-hosted
      - name: Publish performance summary
        if: always()
        run: |
          summary="reports/${{ inputs.scenario || 'soak' }}-summary.md"
          if [ -f "$summary" ]; then cat "$summary" >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: soak-results
          path: reports/
