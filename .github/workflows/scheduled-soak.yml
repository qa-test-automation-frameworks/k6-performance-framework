name: Scheduled soak

on:
  schedule:
    - cron: '30 2 * * 0'
  workflow_call:
    inputs:
      profile:
        required: true
        type: string
      scenario:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      profile:
        description: Use validation for a short verification run
        required: true
        default: full
        type: choice
        options: [full, validation]
      scenario:
        description: Controlled advanced workload
        required: true
        default: soak
        type: choice
        options: [stress, spike, soak, breakpoint]

permissions:
  contents: read
  actions: read

jobs:
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 20
          cache: npm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.2.15
      - uses: grafana/setup-k6-action@db07bd9765aac508ef18982e52ab937fe633a065
        with:
          k6-version: 2.0.0
      - run: npm install --global npm@10.9.4
      - run: npm ci
      - run: npm run build
      - name: Run controlled advanced test
        run: |
          source .github/scripts/start-realworld.sh
          case "${SCENARIO}" in
            stress) script="dist/stress/articles-stress.js" ;;
            spike) script="dist/spike/traffic-spike.js" ;;
            soak) script="dist/soak/endurance-soak.js" ;;
            breakpoint)
              node scripts/find-breakpoint.cjs
              script=''
              ;;
          esac
          if [ -n "$script" ]; then k6 run "$script"; fi
        env:
          SCENARIO: ${{ inputs.scenario || 'soak' }}
          TARGET_ENV: local
          BASE_URL: http://localhost:3000/api
          TEST_PROFILE: ${{ inputs.profile || 'full' }}
          SUMMARY_NAME: ${{ inputs.scenario || 'soak' }}
          TARGET_ID: realworld-local
          TARGET_COMMIT: c8c66858a436a6e07f445fffe2253a65ff6dcb58
          FRAMEWORK_COMMIT: ${{ github.sha }}
          K6_VERSION: 2.0.0
          RUNNER_CLASS: github-hosted
          PERF_STRICT_THRESHOLDS: ${{ inputs.profile == 'validation' && 'false' || 'true' }}
      - name: Compare with latest compatible run
        if: ${{ (inputs.profile || 'full') == 'full' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: advanced-${{ inputs.scenario || 'soak' }}-full
          CANDIDATE_FILE: reports/${{ inputs.scenario || 'soak' }}-summary.json
        run: |
          mkdir -p reports/history
          previous_run=''
          while read -r candidate_run; do
            rm -rf reports/history/*
            if gh run download "$candidate_run" --name "$ARTIFACT_NAME" --dir reports/history; then
              previous_run="$candidate_run"
              break
            fi
          done < <(
            gh run list --workflow scheduled-soak.yml --status success --limit 20 \
              --json databaseId,headSha \
              --jq ".[] | select(.headSha != \"${GITHUB_SHA}\") | .databaseId"
          )
          if [ -z "$previous_run" ]; then
            echo "No previous compatible $ARTIFACT_NAME artifact is available; absolute thresholds remain authoritative."
            exit 0
          fi
          if [ "${{ inputs.scenario || 'soak' }}" = 'breakpoint' ]; then
            previous_file="$(find reports/history -name 'breakpoint-capacity.json' -print -quit)"
            if [ -z "$previous_file" ]; then
              echo "No compatible historical capacity result was downloaded."
              exit 0
            fi
            PREVIOUS_FILE="$previous_file" \
              CANDIDATE_FILE=reports/breakpoint-capacity.json \
              npm run capacity:compare | tee reports/history-comparison.md
          else
            previous_file="$(find reports/history -name "${{ inputs.scenario || 'soak' }}-summary.json" -print -quit)"
            if [ -z "$previous_file" ]; then
              echo "No compatible historical summary was downloaded."
              exit 0
            fi
            PREVIOUS_FILE="$previous_file" npm run history:compare | tee reports/history-comparison.md
          fi
          cat reports/history-comparison.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publish performance summary
        if: always()
        run: |
          summary="reports/${{ inputs.scenario || 'soak' }}-summary.md"
          if [ -f "$summary" ]; then cat "$summary" >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: advanced-${{ inputs.scenario || 'soak' }}-${{ inputs.profile || 'full' }}
          path: reports/
