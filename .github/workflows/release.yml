name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run release:validate
      - run: npm run sbom
      - name: Create release checksums
        shell: bash
        run: sha256sum artifacts/sbom.cdx.json > artifacts/SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
              --title "$GITHUB_REF_NAME"
          fi
          gh release upload "$GITHUB_REF_NAME" \
            artifacts/sbom.cdx.json artifacts/SHA256SUMS --clobber
          assets="$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')"
          grep -qx 'sbom.cdx.json' <<<"$assets"
          grep -qx 'SHA256SUMS' <<<"$assets"
